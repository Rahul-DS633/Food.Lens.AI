[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "foodlens-ai"
version = "0.1.0"
description = "FoodLens AI: Packaged Food Nutrition Analyzer and Food Intelligence Quest"
authors = [{ name = "FoodLens Team" }]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi",
    "uvicorn",
    "pydantic",
    "streamlit",
    "plotly",
    "sqlalchemy",
    "pillow",
    "opencv-python",
    "easyocr",
    "pandas",
    "numpy",
    "pyyaml",
    "requests",
    "httpx",
    "python-dotenv",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "hypothesis",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.ruff.lint]
select = ["E", "F"]
ignore = ["E501", "B008", "E402"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
plugins = []
disable_error_code = ["assignment", "arg-type", "call-overload", "valid-type", "misc"]



